[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-clip"
version = "0.1.0"
description = "AI-powered YouTube Shorts clipping engine — fast, quality-first."
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
authors = [{name = "Amrit Rai"}]
keywords = ["youtube", "shorts", "video", "ai", "clipping"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Content Creators",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "yt-dlp>=2024.0",
    "faster-whisper>=1.0",
    "moviepy>=2.0",
    "opencv-python>=4.9",
    "openai>=1.30",          # OpenRouter-compatible
    "click>=8.1",
    "rich>=13.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
gui = [
    "PySide6>=6.6",
]

[project.scripts]
fast-clip = "fast_clip.cli:main"
fast-clip-gui = "fast_clip.gui:main"

[project.urls]
Homepage = "https://github.com/amritrai/fast-clip"
Issues = "https://github.com/amritrai/fast-clip/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=fast_clip --cov-report=term-missing"